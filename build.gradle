plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
    id 'net.minecraftforge.renamer' version '[1.1.8,2)'
}

version = '1.0.1'
group = 'archer.openglerrorsuppressor'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

base.archivesName = "opengl_error_suppressor-forge"

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
			args '-mixin.config=opengl_error_suppressor.mixins.json'

            systemProperty 'forge.enabledGameTestNamespaces', 'opengl_error_suppressor'
        }

        register('client')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
	maven {
		name = 'SpongePowered'
		url = 'https://repo.spongepowered.org/repository/maven-public/'
	}
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.2-65.1.5')
	compileOnly 'org.spongepowered:mixin:0.8.2'
	annotationProcessor 'org.spongepowered:mixin:0.8.2:processor'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'MixinConfigs': 'opengl_error_suppressor.mixins.json'
        ])
    }
}

configurations.configureEach {
    if (canBeResolved) {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
	
	options.release = 8
}