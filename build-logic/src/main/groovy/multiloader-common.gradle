import com.electronwill.nightconfig.toml.TomlParser
import com.electronwill.nightconfig.toml.TomlWriter
import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'groovy-gradle-plugin'
}

base {
    archivesName = "${mod_id}-${project.name}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    withSourcesJar()
}

sourceSets {
    testmod {
        compileClasspath += main.compileClasspath + main.output
        runtimeClasspath += main.runtimeClasspath + main.output
    }
}

tasks.withType(Jar).matching { it.name.toLowerCase() != 'jarjar' }.configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${name.toLowerCase().contains('test') ? test_mod_id : mod_id}" }
    }
}

tasks.withType(ProcessResources).configureEach {
    var expandProps = [
            'mod_id'               : mod_id.toString(),
            'version'              : version.toString(),
            'mod_name'             : mod_name.toString(),
            'description'          : project.description.toString(),
            'mod_author'           : author.toString(),
            'website'              : website.toString(),
            'license'              : license.toString(),
            'source_url'           : source_url.toString(),
            'issue_tracker'        : issue_tracker.toString(),
            'update_json'          : update_json.toString(),
            'minimum_minecraft'    : minimum_minecraft.toString(),
            'license_url'          : license_url.toString(),
            'test_mod_id'          : test_mod_id.toString(),
            'test_mod_version'     : test_mod_version.toString()
    ]
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand expandProps.collectEntries {
            key, value -> [(key): value?.toString()?.replace('\n', '\\\\n')]
        }
    }
    inputs.properties(expandProps)

    doLast {
        fileTree(destinationDir).matching { include '**/*.json', '**/*.mcmeta', '**/*.toml' }.each { file ->
            if (file.name.endsWith('.toml')) file.text = new TomlWriter().tap { indent = '' }.writeToString(file.withReader('UTF-8') { new TomlParser().parse(it) }).trim()
            else file.text = JsonOutput.toJson(new JsonSlurper().parse(file))
        }
    }
}