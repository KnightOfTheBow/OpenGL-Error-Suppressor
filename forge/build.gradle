plugins {
    id 'multiloader-loader'
    alias(libs.plugins.forge)
    alias(libs.plugins.jarjar)
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'forge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'forge')
            }
        }
    }
}

jarJar.register()

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${libs.versions.minecraft.get()}-${libs.versions.forge.version.get()}")
    implementation(libs.mixin.forge)
    implementation(libs.mixin.extras.forge)

    jarJar(libs.mixin.extras.forge)
}

minecraft {
    mappings channel: 'official', version: libs.versions.minecraft.get()

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('runs/client')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" { sources sourceSets.main }
                "${test_mod_id}" { sources sourceSets.testmod }
            }
        }

        client {
            args '--mixin.config', "${mod_id}.mixins.json",
                 '--mixin.config', "${test_mod_id}.mixins.json"
        }
    }
}

tasks.named('jar').configure {
    enabled = false
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes([
                'MixinConfigs': "${name.toLowerCase().contains('test') ? test_mod_id : mod_id}.mixins.json"
        ])
    }
}

tasks.named('jarJar').configure {
    archiveClassifier.set('')
    from(sourceSets.main.output)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.matching { it.name.startsWith('run') }.configureEach {
    dependsOn(tasks.named('testmodClasses'))
    classpath += sourceSets.testmod.output
}