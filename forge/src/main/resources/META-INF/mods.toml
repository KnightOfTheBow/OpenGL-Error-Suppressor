modLoader = "lowcodefml"
loaderVersion = "[66,)"
license = "${license}"
clientSideOnly = true
issueTrackerURL = "${issue_tracker}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
description = "${description}"
logoFile = "${mod_id}.png"
updateJSONURL = "${update_json}"
authors = "${author}"
displayURL = "${website}"
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minimum_minecraft_version},)"
side = "CLIENT"